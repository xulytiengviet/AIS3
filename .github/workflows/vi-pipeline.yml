name: Vietnamese TinyStories pipeline

on:
  push:
    paths:
      - 'research/tinystories/prepare_vi.py'
      - 'research/tinystories/train_vi.py'
      - 'firmware/esp32_tinystories/tools/generate_vocab.py'
      - 'tests/test_vi_pipeline.py'
      - 'research/tinystories/vi_text.py'
      - 'research/tinystories/audit_vi.py'
      - 'research/kws_vi/**'
      - 'tests/test_kws_vi.py'
      - '.github/workflows/vi-pipeline.yml'
  pull_request:
    paths:
      - 'research/tinystories/prepare_vi.py'
      - 'research/tinystories/train_vi.py'
      - 'firmware/esp32_tinystories/tools/generate_vocab.py'
      - 'tests/test_vi_pipeline.py'
      - 'research/tinystories/vi_text.py'
      - 'research/tinystories/audit_vi.py'
      - 'research/kws_vi/**'
      - 'tests/test_kws_vi.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unicode-corpus-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install 'numpy>=2.5.1' 'tokenizers>=0.23.1'
      - name: Verify Vietnamese corpus split and UTF-8 ByteLevel decoder
        run: |-
          python -m unittest discover -s tests -p 'test_vi_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_kws_vi.py' -v
